name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Build Release APK
      run: ./gradlew assembleRelease
    
    - name: Upload Debug APK to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Release APK to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: android/app/build/outputs/apk/release/app-release-unsigned.apk
        tag_name: latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release
      uses: actions/create-release@v1
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.0
        release_name: HC Decryptor - Bounty Killa Edition
        body: |
          🔓 **BOUNTY KILLA DECRYPTOR**
          ================================
          
          **Features:**
          ✅ HTTP Custom v7.9.17+ Support
          ✅ ChaCha20 Decryption (8 Keys)
          ✅ JKL Decryption (Old + New)
          ✅ Braille Alphabet Support
          ✅ Dynamic Nonce Derivation
          ✅ Optimized for 2GB RAM
          
          **Download & Install:**
          - Extract APK from artifacts
          - Enable Unknown Sources on phone
          - Install APK
          
          **Usage:**
          Select encrypted .h.c file → Decrypt → View Config
          
          Code: @BOUNTY_KILLA
        draft: false
        prerelease: false
